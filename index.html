<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Técnico Principal -->
    <title>Mente de Equipaje | El Podcast</title>
    <meta name="description" content="Historias, reflexiones y todo eso que decidimos cargar (o soltar) al caminar. Un podcast sobre procesos personales y cambios de etapa.">
    <link rel="canonical" href="https://mentedeequipaje.com/">
    
    <!-- Open Graph / Redes Sociales -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mentedeequipaje.com/">
    <meta property="og:title" content="Mente de Equipaje | El Podcast">
    <meta property="og:description" content="Historias, reflexiones y todo eso que decidimos cargar (o soltar) al caminar.">
    <meta property="og:image" content="https://mentedeequipaje.com/og-image.jpg">

    <!-- Datos Estructurados Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "PodcastSeries",
      "name": "Mente de Equipaje",
      "url": "https://mentedeequipaje.com/",
      "description": "Historias, reflexiones y todo eso que decidimos cargar (o soltar) al caminar.",
      "webFeed": "TU_URL_DE_RSS_AQUÍ"
    }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #FF6B6B, #FFD93D);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #FFFFFF;
            text-align: center;
            padding: 40px 20px;
        }

        .container { max-width: 650px; width: 100%; }

        .podcast-tag {
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.15);
            padding: 6px 18px;
            border-radius: 50px;
            margin-bottom: 15px;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 3.8rem;
            font-weight: 900;
            margin-bottom: 30px;
            letter-spacing: -1.5px;
            line-height: 1.05;
            text-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .quote-block { font-size: 1.4rem; font-weight: 300; line-height: 1.6; margin-bottom: 35px; }
        .line { display: block; margin-bottom: 10px; }
        .line-bold { display: block; font-weight: 600; font-size: 1.5rem; }

        .status {
            display: inline-block;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 8px 20px;
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 50px;
            margin-bottom: 35px;
        }

        /* --- BOTÓN TYPEFORM --- */
        .notify-button {
            display: inline-block;
            background: #2D2D2D;
            color: #FFF;
            text-decoration: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .notify-button:hover {
            transform: scale(1.05);
            background: #000;
        }

        /* --- CONTENEDOR DE EPISODIOS AUTOMÁTICOS --- */
        #episodes-container {
            margin-top: 20px;
            text-align: left;
        }

        .episode-card {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .episode-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #FFF;
        }

        .episode-desc {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        audio {
            width: 100%;
            border-radius: 10px;
            outline: none;
        }

        .social-links { display: flex; justify-content: center; gap: 30px; margin-top: 40px; }
        .social-links a { color: #FFF; font-size: 1.8rem; transition: 0.3s; }
        .social-links a:hover { transform: translateY(-4px); color: #2D2D2D; }

        @media (max-width: 600px) {
            h1 { font-size: 2.6rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="podcast-tag">El Podcast</div>
        <h1>Mente de Equipaje</h1>
        
        <div class="quote-block">
            <span class="line">Historias, reflexiones y todo eso que decidimos cargar (o soltar) al caminar.</span>
            <span class="line-bold">El podcast que le pone nombre a lo que pensamos.</span>
        </div>

        <div class="status">Últimos Episodios</div>

        <!-- Formulario de Typeform -->
        <div>
            <a href="https://form.typeform.com/to/nCekVUc0" target="_blank" class="notify-button">
                Únete a la lista de correo
            </a>
        </div>

        <!-- Zona donde aparecen los episodios del RSS -->
        <main id="episodes-container">
            <div class="episode-card" style="text-align: center;">
                <p class="episode-desc">Cargando episodios...</p>
            </div>
        </main>

        <div class="social-links">
            <a href="https://instagram.com/mentedeequipaje" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://youtube.com/@mentedeequipaje" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="mailto:mentedeequipaje@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
        </div>
    </div>

    <!-- Script de Automatización del Feed RSS -->
    <script>
        async function loadPodcastFeed() {
            // Reemplaza esta URL por la tuya cuando la tengas
            const rssUrl = 'TU_URL_DE_RSS_AQUÍ'; 
            const container = document.getElementById('episodes-container');

            try {
                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
                const data = await response.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    container.innerHTML = '';
                    data.items.slice(0, 5).forEach(item => { // Muestra los 5 más recientes
                        const card = document.createElement('article');
                        card.className = 'episode-card';
                        
                        // Limpia etiquetas HTML de la descripción
                        const cleanDesc = item.description.replace(/<[^>]*>?/gm, '').substring(0, 140);
                        
                        card.innerHTML = `
                            <h2 class="episode-title">${item.title}</h2>
                            <p class="episode-desc">${cleanDesc}...</p>
                            <audio controls preload="none">
                                <source src="${item.enclosure.link}" type="audio/mpeg">
                                Tu navegador no soporta este reproductor.
                            </audio>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `
                        <div class="episode-card" style="text-align: center;">
                            <p class="episode-desc">Próximamente el primer episodio disponible aquí.</p>
                        </div>`;
                }
            } catch (error) {
                container.innerHTML = `
                    <div class="episode-card" style="text-align: center;">
                        <p class="episode-desc">Próximamente el primer episodio disponible aquí.</p>
                    </div>`;
            }
        }

        loadPodcastFeed();
    </script>

</body>
</html>
